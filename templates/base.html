<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time multi-source news aggregator automatically collecting and curating latest breaking news.">
    <title>{% block title %}News Pulse - Live Breaking News{% endblock %}</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS Stylesheet Links -->
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') if url_for is defined else '/static/css/style.css' }}">

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light text-dark">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top custom-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary" href="/">
                <div class="brand-icon">
                    <i class="bi bi-newspaper"></i>
                </div>
                <span>News Pulse</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link active fw-medium" href="/">
                            <i class="bi bi-house-door me-1"></i> Home
                        </a>
                    </li>
                </ul>

                <!-- Scrape News Button -->
                <div class="d-flex align-items-center gap-3">
                    <button id="scrapeBtn" class="btn btn-outline-primary rounded-pill btn-scrape d-flex align-items-center gap-2 px-3 py-2">
                        <i class="bi bi-arrow-repeat spin-icon" id="scrapeSpinner" style="display:none;"></i>
                        <i class="bi bi-cloud-arrow-down" id="scrapeIcon"></i>
                        <span>Fetch Latest News</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveToast" class="toast align-items-center text-white border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Action executed.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-4 bg-white border-top">
        <div class="container text-center">
            <div class="text-muted small">
                &copy; 2026 News Pulse Aggregator. Powered by Python, Flask, & SQLite.
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App JavaScript Controllers -->
    <script src="../static/js/app.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') if url_for is defined else '/static/js/app.js' }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
