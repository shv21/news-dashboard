<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time multi-source news aggregator automatically collecting and curating latest breaking news.">
    <title>News Pulse - Multi-Source News Aggregator</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS Stylesheet -->
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light text-dark">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top custom-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary" href="/">
                <div class="brand-icon">
                    <i class="bi bi-newspaper"></i>
                </div>
                <span>News Pulse</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <div class="me-auto"></div>

                <!-- Scrape / Sync Button -->
                <div class="d-flex align-items-center gap-3">
                    <button id="scrapeBtn" class="btn btn-outline-primary rounded-pill btn-scrape d-flex align-items-center gap-2 px-3 py-2">
                        <i class="bi bi-arrow-repeat spin-icon" id="scrapeSpinner" style="display:none;"></i>
                        <i class="bi bi-cloud-arrow-down" id="scrapeIcon"></i>
                        <span>Sync News Database</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container py-4">

        <!-- Custom API Configuration Section (2 Input Boxes) -->
        <section class="api-config-section mb-4 p-4 rounded-4 bg-white border shadow-sm">
            <h6 class="fw-bold text-dark mb-3 text-uppercase text-muted small">
                <i class="bi bi-plug-fill text-primary me-1"></i> Custom News API Configuration
            </h6>
            <div class="row g-3 align-items-end">
                <div class="col-lg-6 col-md-6">
                    <label for="apiUrlInput" class="form-label small fw-bold text-secondary mb-1">
                        1. News API Endpoint URL
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-link-45deg"></i></span>
                        <input type="url" id="apiUrlInput" class="form-control bg-light border-start-0" 
                               value="/api/news" placeholder="Enter API URL (e.g. /api/news or https://...)">
                    </div>
                </div>

                <div class="col-lg-4 col-md-6">
                    <label for="apiKeyInput" class="form-label small fw-bold text-secondary mb-1">
                        2. API Key / Query Parameters (Optional)
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
                        <input type="text" id="apiKeyInput" class="form-control bg-light border-start-0" 
                               placeholder="Optional (e.g. apiKey=12345 or category=tech)">
                    </div>
                </div>

                <div class="col-lg-2 col-md-12">
                    <button id="fetchApiBtn" class="btn btn-primary w-100 rounded-3 py-2 fw-medium">
                        <i class="bi bi-cloud-download me-1"></i> Fetch Data
                    </button>
                </div>
            </div>
        </section>

        <!-- Search & Filter Controls Header -->
        <section class="hero-section mb-4 p-4 rounded-4 bg-white border shadow-sm">
            <div class="row g-3 align-items-center">
                <div class="col-lg-4 col-md-6">
                    <label for="searchInput" class="form-label small text-uppercase text-muted fw-bold mb-1">
                        <i class="bi bi-search me-1"></i> Search Articles
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-search text-secondary"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control bg-light border-start-0 ps-0" placeholder="Type keywords (e.g. AI, Climate, Tech)..." autocomplete="off">
                        <button class="btn btn-outline-secondary d-none" type="button" id="clearSearchBtn">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="col-lg-3 col-md-3">
                    <label for="countrySelect" class="form-label small text-uppercase text-muted fw-bold mb-1">
                        <i class="bi bi-globe-americas me-1"></i> Country / Region
                    </label>
                    <select id="countrySelect" class="form-select bg-light">
                        <option value="all" selected>🌍 All Countries / Global</option>
                        <option value="US">🇺🇸 United States (US)</option>
                        <option value="UK">🇬🇧 United Kingdom (UK)</option>
                        <option value="IN">🇮🇳 India (IN)</option>
                        <option value="CA">🇨🇦 Canada (CA)</option>
                        <option value="AU">🇦🇺 Australia (AU)</option>
                        <option value="DE">🇩🇪 Germany (DE)</option>
                        <option value="JP">🇯🇵 Japan (JP)</option>
                    </select>
                </div>

                <div class="col-lg-2 col-md-3">
                    <label for="sourceSelect" class="form-label small text-uppercase text-muted fw-bold mb-1">
                        <i class="bi bi-funnel me-1"></i> News Source
                    </label>
                    <select id="sourceSelect" class="form-select bg-light">
                        <option value="all" selected>All Sources</option>
                        <option value="BBC News">BBC News (UK)</option>
                        <option value="TechCrunch">TechCrunch (US)</option>
                        <option value="The Verge">The Verge (US)</option>
                        <option value="Wired">Wired (US)</option>
                        <option value="Times of India">Times of India (IN)</option>
                        <option value="CBC News">CBC News (CA)</option>
                        <option value="ABC News Australia">ABC News (AU)</option>
                        <option value="DW News">DW News (DE)</option>
                        <option value="Japan Today">Japan Today (JP)</option>
                    </select>
                </div>

                <div class="col-lg-2 col-md-3">
                    <label for="sortSelect" class="form-label small text-uppercase text-muted fw-bold mb-1">
                        <i class="bi bi-sort-down me-1"></i> Sort By
                    </label>
                    <select id="sortSelect" class="form-select bg-light">
                        <option value="newest" selected>Newest First</option>
                        <option value="oldest">Oldest First</option>
                    </select>
                </div>

                <div class="col-lg-1 col-md-12 text-lg-end d-flex align-items-end">
                    <div class="w-100 mt-2 mt-lg-0">
                        <div class="text-muted small mb-1 d-none d-lg-block">&nbsp;</div>
                        <button id="resetFiltersBtn" class="btn btn-light border w-100 text-secondary px-2" title="Reset Filters">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Active Filter Status & Item Counter -->
        <div class="d-flex align-items-center justify-content-between mb-3 px-1">
            <div class="d-flex align-items-center gap-2">
                <h5 class="fw-bold mb-0 text-dark" id="resultsTitle">Latest News</h5>
                <span class="badge bg-primary rounded-pill fs-7" id="newsCounter">0 articles</span>
            </div>
            <div id="loadingStatus" class="spinner-border spinner-border-sm text-primary" role="status" style="display: none;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- News Cards Container Grid -->
        <div id="newsGrid" class="row g-4">
            <!-- News cards will be dynamically injected here via JavaScript -->
        </div>

        <!-- Empty State Container -->
        <div id="emptyState" class="text-center py-5 my-4 bg-white rounded-4 border shadow-sm" style="display: none;">
            <div class="display-1 text-muted mb-3">
                <i class="bi bi-newspaper"></i>
            </div>
            <h4 class="fw-bold text-dark mb-2">No News Articles Found</h4>
            <p class="text-secondary max-w-md mx-auto mb-4">
                We couldn't find any news matching your criteria. Try adjusting your search query or fetch data from your API.
            </p>
            <button id="emptyStateScrapeBtn" class="btn btn-primary rounded-pill px-4 py-2">
                <i class="bi bi-cloud-arrow-down me-2"></i> Load News Data
            </button>
        </div>

        <!-- Pagination Navigation -->
        <nav class="my-5" id="paginationNav" style="display: none;">
            <ul class="pagination justify-content-center gap-1" id="paginationList">
                <!-- Pagination buttons injected via JS -->
            </ul>
        </nav>
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="liveToast" class="toast align-items-center text-white border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Action executed.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-4 bg-white border-top">
        <div class="container text-center">
            <div class="text-muted small">
                &copy; 2026 News Pulse Aggregator. Powered by Python, Flask, & SQLite.
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App JavaScript Controller -->
    <script src="/static/js/app.js?v=2.1"></script>
</body>
</html>
